<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stream Platform V2</title>

    <link rel="shortcut icon" href="assets/images/preview.png" type="image/x-icon">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</head>
<body class="bg-[#0b0f19]">

    <main>

        <div id="home-loading" class="absolute flex flex-col gap-4 items-center justify-center inset-0">
            <div class="h-12 w-12 animate-spin rounded-full border-4 border-gray-200 border-t-gray-600"></div>
            <p id="text-error" class="text-white font-semibold">Request category and channels ...</p>
        </div>

        <aside id="aside-country" class="hidden absolute h-dvh w-full">

            <div class="bg-[#111827]/95 xl:w-100 h-dvh scrollbar-thumb-gray-500">
                <div class="flex justify-between bg-[#1a2234]">
                    <input id="input-search-country" class="text-slate-100 placeholder-slate-500 p-3 w-full outline-none" type="text" placeholder="Search Category by country ...">
                    <button id="btn-close-aside" class="text-slate-400 hover:text-sky-400 cursor-pointer text-2xl font-bold leading-none pr-4">&times;</button>
                </div>
    
                <ul id="list-country" class="max-h-dvh overflow-y-auto">
    
                </ul>
            </div>

        </aside>

        <section id="popout-create-channels" class="hidden flex fixed inset-0 bg-black/75 backdrop-blur-xs items-center justify-center z-50">
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl w-full max-w-md overflow-hidden">

                <div class="p-4 border-b border-zinc-800 bg-zinc-900/50 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-white">Add new channel to your stream IPTV</h2>
                </div>

                <form class="grid gap-3 p-4">

                    <span id="notification-new-channel" class="hidden font-semibold text-xs text-red-400 bg-red-950/40 p-2 rounded border border-red-900/50"></span>

                    <input id="input-channel-number" class="font-medium p-2.5 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 placeholder-zinc-400 focus:outline-none focus:border-gray-500" type="number" min="1" step="1" placeholder="Channel Number" required>
                    <input id="input-channel-name" class="font-medium p-2.5 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 placeholder-zinc-400 focus:outline-none focus:border-gray-500" type="text" placeholder="Channel Name" minlength="3" maxlength="30" pattern=".{3,30}" required>
                    <input id="input-channel-logoURL" class="font-medium p-2.5 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 placeholder-zinc-400 focus:outline-none focus:border-gray-500" type="text" placeholder="Logo Channel URL" required>
                    <input id="input-channel-streamURL" class="font-medium p-2.5 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 placeholder-zinc-400 focus:outline-none focus:border-gray-500" type="text" placeholder="Stream Channel URL" required>

                    <select id="select-channel-country" class="font-medium rounded-lg p-2.5 bg-zinc-800 border border-zinc-700 text-zinc-100 focus:outline-none focus:border-gray-500" required>
                        <option value="" disabled selected>Please choose Country</option>
                        <option value="MA">Maroc</option>
                        <option value="TN">Tunisia</option>
                        <option value="FR">France</option>
                        <option value="ES">Espane</option>
                        <option value="BE">Belgium</option>
                        <option value="QA">Qatar</option>
                    </select>

                    <select id="select-channel-category" class="font-medium rounded-lg p-2.5 bg-zinc-800 border border-zinc-700 text-zinc-100 focus:outline-none focus:border-gray-500" required>
                        <option value="" disabled selected>Please choose Category</option>
                        <option value="GENERAL">GENERAL</option>
                        <option value="NEWS">NEWS</option>
                        <option value="SPORTS">SPORTS</option>
                        <option value="CINEMA">CINEMA</option>
                        <option value="DOCUMENTAIRE">DOCUMENTAIRE</option>
                        <option value="DIVERTISSEMENT">DIVERTISSEMENT</option>
                    </select>

                    <div class="flex gap-2 mt-2">
                        <button id="btn-create-channel" type="button" class="flex-8 font-semibold text-white rounded-lg bg-gray-700 hover:bg-gray-800 transition-colors h-10 cursor-pointer">
                            Create new channel
                        </button>

                        <button id="btn-close-channels" type="button" class="flex-2 font-semibold text-white rounded-lg bg-red-800 hover:bg-red-900 border border-red-800/50 transition-colors h-10 cursor-pointer">
                            Close
                        </button>
                    </div>

                </form>

            </div>
        </section>

        <section id="main-section" class="blur-md p-4 xl:p-8">

            <div class="grid grid-cols-1 gap-3 xl:flex xl:justify-center xl:gap-6">

                <div class="space-y-2 xl:w-100">

                    <div class="flex gap-2 items-center">

                        <img id="img-aside-country" class="w-13 p-2 bg-[#161d2e] hover:bg-sky-800/50 transition-colors rounded-md cursor-pointer" src="assets/icons/list.svg" alt="list-icon">
                        <input id="search-channels" class="bg-[#161d2e] hover:bg-[#1e2940] focus:bg-[#1e2940] placeholder-slate-500 shadow-md shadow-black/40 transition duration-300 hover p-3 text-slate-100 w-full rounded-md" type="text" placeholder="Search Channel ...">

                    </div>

                    <select id="select-channels" class="bg-[#161d2e] hover:bg-[#1e2940] focus:bg-[#1e2940] text-white p-3 w-full transition-colors rounded-md cursor-pointer" id="pet-select" name="pets">
                        <option class="" value="all-channels" selected>All Channels</option>
                        <option value="favorite-channels">Favorite</option>
                        <option value="blacklist-channels">Blacklist</option>
                    </select>

                    <button id="btn-add-channel" class="bg-[#161d2e] hover:bg-[#1e2940] focus:bg-[#1e2940] text-white p-3 w-full transition-colors rounded-md cursor-pointer">Add new channel</button>

                    <ul id="list-channels" class="max-h-dvh xl:max-h-115 overflow-y-auto space-y-1 scrollbar-thumb-gray-500">

                    </ul>

                </div>

                <div class="flex flex-col gap-3 xl:max-w-200">

                    <video id="channel-preview" class="rounded-md bg-black" controls autoplay muted></video>

                    <ul id="list-epg" class="max-h-40 overflow-y-auto space-y-3">

                        <li>
                            <div class="shadow-xl shadow-black/40">
                                <h1 class="text-slate-100 text-2xl font-semibold">00:00 AM - 00:00AM 000: No Channel Selected</h1>
                                <p class="text-slate-400">No Channel Selected to load EPG data ...</p>
                            </div>
                        </li>

                    </ul>

                </div>

            </div>

        </section>
    </main>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
